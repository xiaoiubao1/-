name: Fix v1.3.2 padding

on:
  push:
    branches: ["agent/v1-3-2-floating-pill-nav"]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-3-2-floating-pill-nav
      - name: Fix Compose padding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/src/main/java/com/xiaoiubao/suixinji/V131App.kt')
          text = path.read_text(encoding='utf-8')
          old = '.padding(horizontal = 18.dp, top = 4.dp, bottom = 8.dp)'
          new = '.padding(start = 18.dp, end = 18.dp, top = 4.dp, bottom = 8.dp)'
          if old not in text:
              raise SystemExit('target padding expression not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/com/xiaoiubao/suixinji/V131App.kt
          git commit -m "fix: 修正悬浮底栏 padding 参数"
          git push origin HEAD:agent/v1-3-2-floating-pill-nav
