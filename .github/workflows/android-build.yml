name: Android Build & Release

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Generate temporary PR signing key
        if: github.event_name == 'pull_request'
        run: |
          TEST_STORE="$RUNNER_TEMP/ci-test-release.jks"
          keytool -genkeypair \
            -keystore "$TEST_STORE" \
            -storetype JKS \
            -storepass ci-test-store-password \
            -keypass ci-test-key-password \
            -alias ci-test-release \
            -keyalg RSA \
            -keysize 2048 \
            -validity 30 \
            -dname "CN=Suixinji CI Test, O=GitHub Actions, C=US"
          {
            echo "ANDROID_KEYSTORE_PATH=$TEST_STORE"
            echo "ANDROID_STORE_PASSWORD=ci-test-store-password"
            echo "ANDROID_KEY_ALIAS=ci-test-release"
            echo "ANDROID_KEY_PASSWORD=ci-test-key-password"
          } >> "$GITHUB_ENV"

      - name: Decode production release signing bundle
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          ANDROID_SIGNING_BUNDLE: ${{ secrets.ANDROID_SIGNING_BUNDLE }}
        run: |
          if [ -z "$ANDROID_SIGNING_BUNDLE" ]; then
            echo "::error::Missing repository secret ANDROID_SIGNING_BUNDLE. Release publishing is intentionally blocked."
            exit 1
          fi
          python3 - <<'PY'
          import base64, binascii, json, os, pathlib, sys

          def decode_b64(label: str, value: str) -> bytes:
              normalized = "".join(value.split())
              normalized += "=" * (-len(normalized) % 4)
              try:
                  return base64.b64decode(normalized, validate=True)
              except (binascii.Error, ValueError) as exc:
                  print(f"::error::{label} is not valid Base64. Re-copy the complete signing bundle without truncation: {exc}")
                  sys.exit(1)

          outer = decode_b64("ANDROID_SIGNING_BUNDLE", os.environ["ANDROID_SIGNING_BUNDLE"])
          try:
              data = json.loads(outer.decode("utf-8"))
          except Exception as exc:
              print(f"::error::ANDROID_SIGNING_BUNDLE decoded, but its JSON payload is invalid: {exc}")
              sys.exit(1)

          required = ("keystore", "storePassword", "keyAlias", "keyPassword")
          missing = [key for key in required if not data.get(key)]
          if missing:
              print(f"::error::Signing bundle is missing required fields: {', '.join(missing)}")
              sys.exit(1)

          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "suixinji-release.jks"
          target.write_bytes(decode_b64("embedded keystore", data["keystore"]))

          values = {
              "ANDROID_KEYSTORE_PATH": str(target),
              "ANDROID_STORE_PASSWORD": data["storePassword"],
              "ANDROID_KEY_ALIAS": data["keyAlias"],
              "ANDROID_KEY_PASSWORD": data["keyPassword"],
          }
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              for key, value in values.items():
                  print(f"::add-mask::{value}")
                  env.write(f"{key}={value}\n")
          PY

      - name: Build signed release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk suixinji.apk
          sha256sum suixinji.apk > suixinji.apk.sha256

      - name: Verify release signature
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs suixinji.apk | tee suixinji.apk.cert.txt

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ github.event_name == 'pull_request' && 'suixinji-ci-release-apk' || 'suixinji-release-apk' }}
          path: |
            suixinji.apk
            suixinji.apk.sha256
            suixinji.apk.cert.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.3.0-build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            suixinji.apk \
            suixinji.apk.sha256 \
            suixinji.apk.cert.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "随心记 v1.3.0 · 正式签名构建 #${GITHUB_RUN_NUMBER}" \
            --notes "v1.3.0 正式签名版：新增桌面小组件 DIY、紧凑一屏周课表，并使用统一角色 APP 图标。\n\n固定下载地址：\nhttps://github.com/${GITHUB_REPOSITORY}/releases/latest/download/suixinji.apk"
