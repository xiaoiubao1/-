name: Android Build & Release

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare public APK
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk suixinji.apk
          sha256sum suixinji.apk > suixinji.apk.sha256

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: suixinji-debug-apk
          path: |
            suixinji.apk
            suixinji.apk.sha256
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" \
            suixinji.apk \
            suixinji.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "随心记 自动构建 #${GITHUB_RUN_NUMBER}" \
            --notes "这是由 GitHub Actions 从 main 分支自动构建的最新版 Android APK。\n\n网站固定下载地址：\nhttps://github.com/${GITHUB_REPOSITORY}/releases/latest/download/suixinji.apk"
