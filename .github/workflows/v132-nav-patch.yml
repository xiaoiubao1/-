name: Apply v1.3.2 floating pill navigation

on:
  push:
    branches: ["agent/v1-3-2-floating-pill-nav"]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/v1-3-2-floating-pill-nav
          fetch-depth: 0

      - name: Apply source patch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('app/src/main/java/com/xiaoiubao/suixinji/V131App.kt')
          text = app.read_text(encoding='utf-8')
          start = text.index('@Composable\nprivate fun V131BottomBar')
          end = text.index('\n@Composable\nprivate fun V131UriImage', start)
          replacement = r'''@Composable
          private fun V131BottomBar(selected: V131Section, onSelect: (V131Section) -> Unit) {
              val wallpaper = LocalV131HasWallpaper.current
              Box(
                  Modifier
                      .fillMaxWidth()
                      .navigationBarsPadding()
                      .padding(horizontal = 18.dp, top = 4.dp, bottom = 8.dp),
                  contentAlignment = Alignment.Center
              ) {
                  Surface(
                      modifier = Modifier.fillMaxWidth().height(66.dp),
                      shape = RoundedCornerShape(33.dp),
                      color = Color.White.copy(alpha = if (wallpaper) 0.10f else 0.34f),
                      border = BorderStroke(
                          1.dp,
                          Color.White.copy(alpha = if (wallpaper) 0.28f else 0.60f)
                      ),
                      shadowElevation = if (wallpaper) 0.dp else 2.dp,
                      tonalElevation = 0.dp
                  ) {
                      Row(
                          Modifier.fillMaxSize().padding(horizontal = 6.dp, vertical = 5.dp),
                          verticalAlignment = Alignment.CenterVertically,
                          horizontalArrangement = Arrangement.spacedBy(4.dp)
                      ) {
                          V131NavItem(
                              Modifier.weight(1f),
                              selected == V131Section.TIMETABLE,
                              Icons.Default.CalendarMonth,
                              "课表"
                          ) { onSelect(V131Section.TIMETABLE) }
                          V131NavItem(
                              Modifier.weight(1f),
                              selected == V131Section.NOTES,
                              Icons.Default.NoteAlt,
                              "随心记"
                          ) { onSelect(V131Section.NOTES) }
                          V131NavItem(
                              Modifier.weight(1f),
                              selected == V131Section.SETTINGS,
                              Icons.Default.Person,
                              "我的"
                          ) { onSelect(V131Section.SETTINGS) }
                      }
                  }
              }
          }

          @Composable
          private fun V131NavItem(
              modifier: Modifier,
              selected: Boolean,
              icon: androidx.compose.ui.graphics.vector.ImageVector,
              label: String,
              onClick: () -> Unit
          ) {
              val wallpaper = LocalV131HasWallpaper.current
              val color = if (selected) {
                  MaterialTheme.colorScheme.primary
              } else {
                  MaterialTheme.colorScheme.onSurface.copy(alpha = 0.68f)
              }
              val selectedBackground = MaterialTheme.colorScheme.primary.copy(
                  alpha = if (wallpaper) 0.18f else 0.13f
              )
              Column(
                  modifier = modifier
                      .fillMaxHeight()
                      .clip(RoundedCornerShape(26.dp))
                      .background(if (selected) selectedBackground else Color.Transparent)
                      .clickable(onClick = onClick),
                  verticalArrangement = Arrangement.Center,
                  horizontalAlignment = Alignment.CenterHorizontally
              ) {
                  Icon(icon, null, tint = color, modifier = Modifier.size(21.dp))
                  Spacer(Modifier.height(2.dp))
                  Text(
                      label,
                      fontSize = 10.5.sp,
                      color = color,
                      fontWeight = if (selected) FontWeight.Bold else FontWeight.Medium
                  )
              }
          }
          '''
          # Remove indentation that exists only to keep this workflow YAML readable.
          replacement = '\n'.join(line[10:] if line.startswith('          ') else line for line in replacement.splitlines())
          app.write_text(text[:start] + replacement + text[end:], encoding='utf-8')

          gradle = Path('app/build.gradle.kts')
          g = gradle.read_text(encoding='utf-8')
          g = g.replace('versionCode = 5', 'versionCode = 6')
          g = g.replace('versionName = "1.3.1"', 'versionName = "1.3.2"')
          gradle.write_text(g, encoding='utf-8')

          release = Path('.github/workflows/android-build.yml')
          r = release.read_text(encoding='utf-8').replace('v1.3.1', 'v1.3.2')
          r = r.replace('交互与玻璃效果优化', '悬浮圆角胶囊底栏')
          release.write_text(r, encoding='utf-8')

          readme = Path('README.md')
          rd = readme.read_text(encoding='utf-8')
          rd = rd.replace('当前版本 **v1.3.1**', '当前版本 **v1.3.2**', 1)
          marker = '\n## v1.3.1 优化\n'
          section = '''\n## v1.3.2 优化\n\n- ⭕ **悬浮圆角底栏**：底部导航改成左右留白的胶囊形玻璃容器，不再铺满整屏\n- 🫧 **高透明玻璃**：自定义壁纸时底栏继续维持约 10% 不透明度，并增加轻量描边\n- 🎯 **圆润选中态**：课表 / 随心记 / 我的当前项使用独立圆角胶囊高亮\n- 📐 **悬浮间距**：底栏与左右边缘、系统导航区域保留呼吸空间\n- 🔢 **版本**：versionCode 6 / versionName 1.3.2\n'''
          if '## v1.3.2 优化' not in rd:
              if marker in rd:
                  rd = rd.replace(marker, section + marker, 1)
              else:
                  rd = rd.replace('\n## ', section + '\n## ', 1)
          readme.write_text(rd, encoding='utf-8')

          Path('.github/workflows/v132-nav-patch.yml').unlink()
          PY

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "随心记 v1.3.2：悬浮圆角胶囊底栏"
          git push origin HEAD:agent/v1-3-2-floating-pill-nav
